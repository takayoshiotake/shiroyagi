services:
  web:
    depends_on:
      postgres:
        condition: service_started
      keycloak:
        condition: service_started
      stalwart:
        condition: service_healthy
    environment:
      IMAP_ALLOW_INSECURE_AUTH: "true"
      SMTP_ALLOW_INSECURE_AUTH: "true"
    ports:
      - "8080:8080"

  postgres:
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: start-dev --import-realm
    ports:
      - "8081:8081"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://keycloak.localhost:8081
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    networks:
      app:
        aliases:
          - keycloak.localhost

  stalwart:
    build: ./dev/stalwart
    ports:
      - "127.0.0.1:2143:31143"
      - "127.0.0.1:1025:1025"
    volumes:
      - stalwart_data:/var/lib/stalwart
    networks:
      - app
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/shiroyagi-stalwart-ready"]
      interval: 2s
      timeout: 2s
      start_period: 30s
      retries: 45

volumes:
  stalwart_data:
