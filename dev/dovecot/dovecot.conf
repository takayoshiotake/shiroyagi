dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5
!include /etc/dovecot/vendor.d/rootless.conf

protocols = imap
listen = *

auth_allow_cleartext = yes
auth_mechanisms = plain login

mail_driver = maildir
mail_home = /srv/vmail/%{user}
mail_path = ~/Maildir
mail_uid = vmail
mail_gid = vmail
ssl = no
first_valid_uid = 1

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb static {
  allow_all_users = yes
  fields {
    uid = vmail
    gid = vmail
    home = /srv/vmail/%{user}
  }
}

service imap-login {
  inet_listener imap {
    port = 31143
  }

  inet_listener imaps {
    port = 0
  }
}

service doveadm {
  inet_listener http {
    port = 0
  }
}
